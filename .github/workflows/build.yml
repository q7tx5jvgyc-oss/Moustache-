name: Build Moustache Theos Tweak

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install make dpkg perl

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          echo "$HOME/theos/bin" >> $GITHUB_PATH

      - name: Verify project files
        run: ls -R

      - name: Build package
        run: |
          export THEOS=$HOME/theos
          make package

      - name: Collect output files
        run: |
          mkdir -p output
          find . -name "*.deb" -exec cp {} output/ \; || true
          find . -name "*.dylib" -exec cp {} output/ \; || true

      - name: Show output
        run: ls -R output || true

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Moustache-build
          path: output/
